<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вишлист · 3 января</title>
<meta name="description" content="Мой вишлист на день рождения. Выбери подарок — я не узнаю, кто что выбрал.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // ===== НАСТРОЙКИ =====
  const CONFIG = {
    // Ссылка на веб-приложение Apps Script (оканчивается на /exec).
    // Пока пусто — страница работает в демо-режиме с примерами.
    API_URL: 'https://script.google.com/macros/s/AKfycbxkQ1zd2LUu-Mz-aXYPHWVubOAaR8-vsBgiO-oU_Ct0aOZMIQOpoqq-Ln5a7yZnrsal/exec',
    TITLE: 'Мой вишлист',
    BIRTH_YEAR: 1994,
    BIRTHDAY: '2027-01-03T00:00:00+05:00'
  };
</script>
<style>
  :root {
    --bg: #E9EDF3;
    --paper: #FFFFFF;
    --ink: #1B1F27;
    --muted: #6B7383;
    --cobalt: #2F4BFF;
    --sun: #FFD23F;
    --done: #A3A9B5;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.5 "Golos Text", system-ui, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Hero ---------- */
  header { padding: 84px 0 40px; }
  .date {
    font: 800 clamp(96px, 24vw, 232px)/0.86 "Unbounded", sans-serif;
    letter-spacing: -0.05em; color: var(--cobalt); margin: 0;
  }
  .date span { display: inline-block; transform-origin: 50% 80%; }
  @media (prefers-reduced-motion: no-preference) {
    .date span { animation: hop .7s cubic-bezier(.3,1.6,.5,1) both; }
    .date span:nth-child(2) { animation-delay: .06s } .date span:nth-child(3) { animation-delay: .12s }
    .date span:nth-child(4) { animation-delay: .18s } .date span:nth-child(5) { animation-delay: .24s }
  }
  @keyframes hop { from { transform: translateY(40%) rotate(-8deg); opacity: 0 } }
  h1 { font: 500 clamp(24px, 4vw, 34px)/1.15 "Unbounded", sans-serif; margin: 22px 0 10px; letter-spacing: -0.01em; }
  .lead { max-width: 34em; color: var(--muted); margin: 0; }
  .owner-bar {
    display: none; margin-top: 22px; padding: 12px 16px; border-radius: var(--radius);
    background: var(--ink); color: #fff; font-size: 15px; max-width: 36em;
  }
  .owner .owner-bar { display: block; }
  .owner-bar button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-left: 6px; }

  /* ---------- Gift tags ---------- */
  h2 { font: 500 22px/1.2 "Unbounded", sans-serif; margin: 48px 0 18px; letter-spacing: -0.01em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .tag {
    position: relative; background: var(--paper); padding: 22px 22px 20px 40px;
    clip-path: polygon(22px 0, 100% 0, 100% 100%, 22px 100%, 0 calc(100% - 22px), 0 22px);
    display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-content: start;
    min-height: 168px;
  }
  .tag::before { /* дырочка для ленточки */
    content: ""; position: absolute; left: 13px; top: 50%; width: 11px; height: 11px;
    margin-top: -5.5px; border-radius: 50%; background: var(--bg);
  }
  .tag h3 { font: 600 19px/1.3 "Golos Text", sans-serif; margin: 0; grid-column: 1; }
  .tag h3 a { text-decoration: none; }
  .tag h3 a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .price { font-weight: 500; grid-column: 1; }
  .note { color: var(--muted); font-size: 15px; grid-column: 1; margin: 2px 0 0; }
  .thumb { grid-column: 2; grid-row: 1 / span 3; width: 88px; height: 88px; object-fit: cover; border-radius: 10px; background: var(--bg); }
  .want {
    position: absolute; top: 12px; right: -6px; background: var(--sun); font-size: 13px; font-weight: 600;
    padding: 3px 16px 3px 10px; transform: rotate(3deg);
  }
  .has-want h3 { padding-right: 84px; }
  .has-want.has-img h3 { padding-right: 0; }
  .has-want.has-img .want { top: auto; bottom: 14px; }
  .actions { grid-column: 1 / -1; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .btn {
    font: 600 15px/1 "Golos Text", sans-serif; border: 0; cursor: pointer; border-radius: 999px;
    padding: 12px 18px; background: var(--cobalt); color: #fff;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: progress; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .link { all: unset; cursor: pointer; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .status { font-size: 15px; font-weight: 500; }
  .code { font: 800 15px/1 "Unbounded", sans-serif; letter-spacing: .08em; background: var(--sun); padding: 6px 8px; border-radius: 6px; }
  .mine { box-shadow: inset 0 0 0 3px var(--cobalt); }
  .taken { background: #F5F6F9; }
  .taken h3, .taken .price { color: var(--muted); }
  .codeform { display: flex; gap: 8px; width: 100%; }
  .codeform input { flex: 1; min-width: 0; text-transform: uppercase; }
  .msg { font-size: 14px; width: 100%; color: #C2331B; }

  .received .tag { min-height: 0; background: #DDE2EA; }
  .received h3 { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .received .thumb, .received .note, .received .want, .received .actions { display: none; }

  .empty { background: var(--paper); border-radius: var(--radius); padding: 28px; color: var(--muted); }

  /* ---------- Поздравления ---------- */
  .wall { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .lock { background: var(--ink); color: #fff; border-radius: var(--radius); padding: 28px; }
  .lock p { margin: 0 0 6px; }
  .lock .big { font: 500 22px/1.25 "Unbounded", sans-serif; margin-bottom: 10px; }
  .lock .muted { color: #AEB4C2; }
  form.wish { background: var(--paper); border-radius: var(--radius); padding: 24px; display: grid; gap: 12px; }
  label { font-size: 14px; font-weight: 500; display: grid; gap: 6px; }
  input, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 0; border-radius: 10px; padding: 12px 14px;
  }
  textarea { min-height: 120px; resize: vertical; }
  .cards { columns: 2 300px; column-gap: 18px; }
  .card { break-inside: avoid; background: var(--paper); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
  .card p { margin: 0 0 10px; white-space: pre-wrap; }
  .card b { font-weight: 600; }

  footer { padding: 64px 0 40px; color: var(--muted); font-size: 14px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--ink); color: #fff;
    padding: 12px 18px; border-radius: 999px; font-size: 15px; transition: transform .25s, visibility .25s; max-width: calc(100% - 32px); visibility: hidden;
  }
  .toast.show { transform: translate(-50%, 0); visibility: visible; }
  .demo { background: var(--sun); text-align: center; font-size: 14px; padding: 8px 16px; }

  @media (max-width: 420px) {
    body { font-size: 16px; }
    .grid { grid-template-columns: 1fr; }
    .thumb { width: 72px; height: 72px; }
  }
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Демо-режим: показаны примеры, брони сохраняются только в этом браузере.</div>

<header class="wrap">
  <p class="date" aria-label="3 января"><span>0</span><span>3</span><span>.</span><span>0</span><span>1</span></p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="owner-bar" role="status">
    Режим именинника: брони скрыты, все подарки выглядят свободными.
    <button type="button" id="exitOwner">Выйти из режима</button>
  </div>
</header>

<main class="wrap">
  <section aria-labelledby="h-gifts">
    <h2 id="h-gifts">Подарки</h2>
    <div class="grid" id="gifts"><div class="empty">Загружаю список…</div></div>
  </section>

  <section aria-labelledby="h-wall">
    <h2 id="h-wall">Поздравления</h2>
    <div class="wall" id="wall"></div>
  </section>

  <section aria-labelledby="h-done" id="doneSection" hidden>
    <h2 id="h-done">Уже подарили</h2>
    <div class="grid received" id="done"></div>
  </section>
</main>

<footer class="wrap">Кто что подарит, именинник не видит: имена при бронировании не сохраняются.</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
    return n;
  };
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ----- режим именинника: открой сайт один раз со ссылкой ?me -----
  const params = new URLSearchParams(location.search);
  if (params.has('me')) { store.set('wl_owner', true); history.replaceState(null, '', location.pathname); }
  let owner = store.get('wl_owner', false);
  const applyOwner = () => document.body.classList.toggle('owner', owner);
  $('#exitOwner').onclick = () => { owner = false; store.set('wl_owner', false); applyOwner(); render(); };
  applyOwner();

  // ----- шапка -----
  const bday = new Date(CONFIG.BIRTHDAY);
  $('#title').textContent = CONFIG.TITLE;
  $('#lead').textContent = `Исполняется ${bday.getFullYear() - CONFIG.BIRTH_YEAR}. Выбери подарок и нажми «Подарю это» — остальные увидят, что он занят, а я не узнаю, кто что выбрал.`;

  let toastT;
  const toast = t => { const n = $('#toast'); n.textContent = t; n.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => n.classList.remove('show'), 3200); };

  // ----- API (или демо) -----
  const demo = !CONFIG.API_URL;
  $('#demo').hidden = !demo;
  const demoDB = () => store.get('wl_demo', {
    gifts: [
      { id: 'a1', title: 'Беспроводные наушники', url: 'https://example.com', price: '40 000 ₸', image: '', note: 'Любой цвет, кроме белого', priority: true, received: false },
      { id: 'a2', title: 'Сертификат в книжный', url: '', price: '10 000 ₸', image: '', note: 'Номинал на твой вкус', priority: false, received: false },
      { id: 'a3', title: 'Френч-пресс на 1 литр', url: 'https://example.com', price: '12 000 ₸', image: '', note: '', priority: false, received: false },
      { id: 'a4', title: 'Настольная игра «Каркассон»', url: '', price: '18 000 ₸', image: '', note: 'Базовая версия, без дополнений', priority: true, received: false },
      { id: 'a5', title: 'Шерстяной шарф', url: '', price: '', image: '', note: '', priority: false, received: true }
    ],
    res: {}, wishes: []
  });
  const api = {
    async list() {
      if (demo) { const d = demoDB(); const open = new Date() >= bday;
        return { ok: true, gifts: d.gifts.map(g => ({ ...g, reserved: !!d.res[g.id] })), wishesOpen: open, wishesCount: d.wishes.length, wishes: open ? d.wishes : [] }; }
      const r = await fetch(CONFIG.API_URL); return r.json();
    },
    async post(body) {
      if (demo) {
        const d = demoDB(); let out = { ok: true };
        if (body.action === 'reserve') { if (d.res[body.id]) out = { ok: false, error: 'taken' }; else { out.code = Math.random().toString(36).slice(2, 7).toUpperCase(); d.res[body.id] = out.code; } }
        if (body.action === 'cancel') { if (d.res[body.id] && d.res[body.id] === body.code.toUpperCase()) delete d.res[body.id]; else out = { ok: false, error: 'wrong_code' }; }
        if (body.action === 'wish') d.wishes.push({ name: body.name, text: body.text });
        store.set('wl_demo', d); return out;
      }
      const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      return r.json();
    }
  };

  let data = null;
  const myCodes = () => store.get('wl_codes', {});
  const setMyCode = (id, code) => { const m = myCodes(); if (code) m[id] = code; else delete m[id]; store.set('wl_codes', m); };

  async function load() {
    try { data = await api.list(); if (!data.ok) throw new Error(data.error); render(); }
    catch (e) { $('#gifts').replaceChildren(el('div', { class: 'empty' }, 'Не получилось загрузить список. Проверь интернет и обнови страницу.')); }
  }

  const ERR = { taken: 'Этот подарок только что забронировал кто-то другой.', wrong_code: 'Код не подошёл. Проверь буквы и цифры.', received: 'Этот подарок уже получен.', empty: 'Заполни имя и текст.' };

  async function act(btn, body, onOk) {
    btn.disabled = true;
    try {
      const r = await api.post(body);
      if (r.ok) onOk(r); else toast(ERR[r.error] || 'Не получилось. Попробуй ещё раз.');
    } catch { toast('Нет связи с сервером. Попробуй ещё раз.'); }
    btn.disabled = false;
    await load();
  }

  function giftTag(g) {
    const mine = myCodes()[g.id];
    const reserved = g.reserved && !owner;
    const cls = ['tag', g.priority && 'has-want', g.image && 'has-img', reserved && (mine ? 'mine' : 'taken')].filter(Boolean).join(' ');
    const title = g.url ? el('a', { href: g.url, target: '_blank', rel: 'noopener' }, g.title) : g.title;
    const actions = el('div', { class: 'actions' });

    if (g.received || owner) { /* без действий */ }
    else if (!g.reserved) {
      const b = el('button', { class: 'btn', type: 'button' }, 'Подарю это');
      b.onclick = () => act(b, { action: 'reserve', id: g.id }, r => { setMyCode(g.id, r.code); toast(`Забронировано. Твой код отмены: ${r.code}`); });
      actions.append(b);
    } else if (mine) {
      const b = el('button', { class: 'btn ghost', type: 'button' }, 'Отменить бронь');
      b.onclick = () => act(b, { action: 'cancel', id: g.id, code: mine }, () => { setMyCode(g.id, null); toast('Бронь отменена.'); });
      actions.append(el('span', { class: 'status' }, 'Это даришь ты. Код отмены'), el('span', { class: 'code' }, mine), b);
    } else {
      const open = el('button', { class: 'link', type: 'button' }, 'Это я бронировал — отменить по коду');
      actions.append(el('span', { class: 'status' }, 'Уже кто-то дарит'), open);
      open.onclick = () => {
        const inp = el('input', { 'aria-label': 'Код отмены', placeholder: 'Код отмены', maxlength: 8, autocomplete: 'off' });
        const b = el('button', { class: 'btn ghost', type: 'submit' }, 'Отменить бронь');
        const f = el('form', { class: 'codeform' }, inp, b);
        f.onsubmit = e => { e.preventDefault(); act(b, { action: 'cancel', id: g.id, code: inp.value.trim() }, () => { setMyCode(g.id, null); toast('Бронь отменена.'); }); };
        open.replaceWith(f); inp.focus();
      };
    }

    return el('article', { class: cls },
      g.priority && el('span', { class: 'want' }, 'очень хочу'),
      el('h3', {}, title),
      g.price && el('div', { class: 'price' }, g.price),
      g.note && el('p', { class: 'note' }, g.note),
      g.image && el('img', { class: 'thumb', src: g.image, alt: '', loading: 'lazy', onerror: e => e.target.remove() }),
      actions.childNodes.length ? actions : null
    );
  }

  function render() {
    if (!data) return;
    const active = data.gifts.filter(g => !g.received);
    // приоритетные сверху, затем свободные, затем занятые
    active.sort((a, b) => (b.priority - a.priority) || ((owner ? 0 : a.reserved - b.reserved)));
    $('#gifts').replaceChildren(...(active.length ? active.map(giftTag)
      : [el('div', { class: 'empty' }, 'Список пока пустой — подарки скоро появятся. Загляни позже.')]));

    const done = data.gifts.filter(g => g.received);
    $('#doneSection').hidden = !done.length;
    $('#done').replaceChildren(...done.map(giftTag));

    renderWall();
  }

  function renderWall() {
    const wall = $('#wall');
    const kids = [];
    if (data.wishesOpen) {
      if (data.wishes.length) kids.push(el('div', { class: 'cards' }, data.wishes.map(w => el('div', { class: 'card' }, el('p', {}, w.text), el('b', {}, w.name)))));
      else kids.push(el('div', { class: 'empty' }, 'Поздравлений пока нет. Напиши первым!'));
    } else {
      const days = Math.max(1, Math.ceil((bday - new Date()) / 864e5));
      const n = data.wishesCount;
      kids.push(el('div', { class: 'lock' },
        el('p', { class: 'big' }, 'Откроется 3 января'),
        el('p', {}, owner ? 'Тексты спрятаны до дня рождения — даже от тебя.' : 'Напиши поздравление заранее. Именинник прочитает его только в день рождения.'),
        el('p', { class: 'muted' }, `Уже написали: ${n}. До открытия ${days} ${plural(days, 'день', 'дня', 'дней')}.`)));
    }
    if (!owner) kids.push(wishForm());
    wall.replaceChildren(...kids);
  }

  function wishForm() {
    const name = el('input', { name: 'name', maxlength: 60, required: true, autocomplete: 'name' });
    const text = el('textarea', { name: 'text', maxlength: 1000, required: true });
    const b = el('button', { class: 'btn', type: 'submit' }, 'Отправить поздравление');
    const f = el('form', { class: 'wish' },
      el('label', {}, 'Твоё имя', name),
      el('label', {}, 'Поздравление', text),
      el('div', {}, b));
    f.onsubmit = e => { e.preventDefault(); act(b, { action: 'wish', name: name.value, text: text.value }, () => toast('Поздравление отправлено.')); };
    return f;
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  load();
})();
</script>
</body>
</html>
