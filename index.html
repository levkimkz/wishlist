<style>
  :root {
    --sun: #FFDD2E;
    --pink: #FF5FA2;
    --cobalt: #2340FF;
    --ink: #000;
    --paper: #fff;
    --muted: #4A4A55;
    --line: 2.5px solid var(--ink);
    --pop: 6px 6px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--pink); color: var(--ink); font: 400 17px/1.5 "Golos Text", system-ui, sans-serif; overflow-x: hidden; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 20px; position: relative; }

  /* ---------- стикеры ---------- */
  .st { position: absolute; z-index: 2; pointer-events: none; }
  .st img { display: block; width: 100%; height: auto; filter: drop-shadow(3px 5px 0 rgba(0,0,0,.18)); }
  .st figcaption {
    position: absolute; white-space: nowrap; font: 600 22px/1 "Caveat", cursive; color: var(--ink);
    background: var(--paper); border: var(--line); border-radius: 999px; padding: 4px 12px 6px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .slap { animation: slap .5s cubic-bezier(.2,1.5,.4,1) both; animation-delay: var(--d, 0s); }
    @keyframes slap { from { transform: scale(1.5) rotate(var(--r0, -12deg)); opacity: 0; } }
  }

  /* ---------- шапка ---------- */
  header { background: var(--sun); border-bottom: var(--line); position: relative; overflow: hidden; }
  .hero { min-height: min(92vh, 760px); display: grid; align-content: center; justify-items: center; text-align: center; padding: 120px 20px 110px; position: relative; }
  .date {
    font: 900 clamp(110px, 25vw, 280px)/.82 "Unbounded", sans-serif; letter-spacing: -.06em; margin: 0;
    color: var(--cobalt); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 8px 8px 0 var(--ink); position: relative; z-index: 1;
  }
  h1 { font: 900 clamp(34px, 6vw, 64px)/1 "Unbounded", sans-serif; letter-spacing: -.02em; margin: 34px 0 14px; position: relative; z-index: 3; }
  .lead { max-width: 30em; margin: 0; font-size: 18px; position: relative; z-index: 3; }
  .owner-bar {
    display: none; margin: 22px auto 0; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: #fff;
    font-size: 15px; max-width: 34em; position: relative; z-index: 3;
  }
  .owner .owner-bar { display: block; }
  .owner-bar button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-left: 6px; }

  .s-heart  { width: 150px; left: 4%;  top: 40px;  transform: rotate(-8deg); }
  .s-kid    { width: 140px; left: 9%;  bottom: 18px; transform: rotate(6deg); }
  .s-snow   { width: 120px; right: 9%; top: 34px;  transform: rotate(7deg); }
  .s-xmas   { width: 190px; right: 3%; bottom: 10px; transform: rotate(-5deg); }
  .s-kid figcaption  { left: 45%; top: -7%; transform: rotate(-6deg); }
  .s-snow figcaption { right: 80%; top: 52%; transform: rotate(5deg); }
  .s-xmas figcaption { right: 70%; top: -6%; transform: rotate(-4deg); }

  /* ---------- секции ---------- */
  section { padding: 64px 0; position: relative; }
  h2 { font: 900 clamp(30px, 5vw, 44px)/1 "Unbounded", sans-serif; letter-spacing: -.02em; margin: 0 0 28px; }
  .gifts-sec { background: var(--pink); }
  .s-ears { width: 210px; left: calc(50% - 460px - 240px); top: 120px; transform: rotate(-6deg); }
  .s-eco  { width: 190px; right: calc(50% - 460px - 225px); top: 420px; transform: rotate(5deg); }

  /* ---------- карточки подарков ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .tag {
    position: relative; background: var(--paper); border: var(--line); border-radius: 22px; box-shadow: var(--pop);
    padding: 22px 22px 20px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-content: start;
  }
  .tag h3 { font: 600 20px/1.25 "Golos Text", sans-serif; margin: 0; grid-column: 1; }
  .tag h3 a { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--pink); }
  .tag h3 a:hover { text-decoration-color: var(--ink); }
  .price { font: 900 18px/1.2 "Unbounded", sans-serif; grid-column: 1; }
  .note { color: var(--muted); font-size: 15px; grid-column: 1; margin: 0; }
  .thumb { grid-column: 2; grid-row: 1 / span 3; width: 92px; height: 92px; object-fit: cover; border-radius: 14px; border: var(--line); }
  .want {
    position: absolute; top: -14px; right: 18px; background: var(--sun); border: var(--line); border-radius: 999px;
    font: 600 21px/1 "Caveat", cursive; padding: 3px 12px 6px; transform: rotate(4deg);
  }
  .actions { grid-column: 1 / -1; margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn {
    font: 600 16px/1 "Golos Text", sans-serif; border: var(--line); cursor: pointer; border-radius: 999px;
    padding: 12px 20px; background: var(--cobalt); color: #fff; box-shadow: 3px 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.ghost { background: var(--paper); color: var(--ink); }
  .link { all: unset; cursor: pointer; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }
  .status { font-size: 15px; font-weight: 600; }
  .code { font: 900 15px/1 "Unbounded", sans-serif; letter-spacing: .08em; background: var(--sun); border: var(--line); padding: 6px 9px; border-radius: 8px; }
  .mine { background: #EEF1FF; }
  .taken { background: #F3F0F2; box-shadow: 3px 3px 0 var(--ink); }
  .taken h3, .taken .price { opacity: .55; }
  .taken .want { filter: grayscale(1); }
  .codeform { display: flex; gap: 8px; width: 100%; }
  .codeform input { flex: 1; min-width: 0; text-transform: uppercase; }
  .empty { background: var(--paper); border: var(--line); border-radius: 22px; padding: 28px; box-shadow: var(--pop); font-weight: 500; }

  /* ---------- поздравления ---------- */
  .wall-sec { background: var(--cobalt); color: #fff; border-top: var(--line); border-bottom: var(--line); }
  .wall-sec h2 { color: var(--sun); }
  .wall { display: grid; gap: 22px; max-width: 640px; }
  .lock { background: var(--sun); color: var(--ink); border: var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--pop); }
  .lock p { margin: 0 0 6px; }
  .lock .big { font: 900 24px/1.2 "Unbounded", sans-serif; margin-bottom: 10px; }
  .lock .muted { color: var(--muted); }
  form.wish { background: var(--paper); color: var(--ink); border: var(--line); border-radius: 22px; padding: 24px; display: grid; gap: 14px; box-shadow: var(--pop); }
  label { font-size: 14px; font-weight: 600; display: grid; gap: 6px; }
  input, textarea { font: inherit; color: var(--ink); background: #fff; border: var(--line); border-radius: 12px; padding: 12px 14px; }
  textarea { min-height: 120px; resize: vertical; }
  .cards { columns: 2 280px; column-gap: 22px; }
  .card { break-inside: avoid; background: var(--paper); color: var(--ink); border: var(--line); border-radius: 22px; padding: 20px; margin-bottom: 22px; box-shadow: var(--pop); }
  .card p { margin: 0 0 10px; white-space: pre-wrap; }
  .card b { font: 600 22px/1 "Caveat", cursive; }
  .s-speaker { width: 200px; right: calc(50% - 460px + 10px); top: 40px; transform: rotate(4deg); }
  .s-speaker figcaption { right: 78%; bottom: 34%; transform: rotate(-5deg); }

  /* ---------- уже подарили ---------- */
  .done-sec { background: var(--sun); border-bottom: var(--line); }
  .received .tag { box-shadow: none; background: transparent; padding: 14px 20px; }
  .received h3 { text-decoration: line-through; text-decoration-thickness: 2px; }
  .received .thumb, .received .note, .received .want, .received .actions, .received .price { display: none; }
  .s-hug { width: 170px; right: calc(50% - 460px + 10px); top: 24px; transform: rotate(-4deg); }
  .s-hug figcaption { right: 82%; top: 40%; transform: rotate(4deg); }

  footer { background: var(--pink); padding: 70px 0 60px; position: relative; overflow: hidden; }
  footer p { margin: 0; max-width: 28em; font-weight: 500; }
  .s-beanie { width: 190px; right: 6%; bottom: -30px; transform: rotate(-8deg); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); background: var(--ink); color: #fff; z-index: 10;
    padding: 12px 20px; border-radius: 999px; font-size: 15px; transition: transform .25s, visibility .25s; max-width: calc(100% - 32px); visibility: hidden;
  }
  .toast.show { transform: translate(-50%, 0); visibility: visible; }
  .demo { background: var(--ink); color: #fff; text-align: center; font-size: 14px; padding: 8px 16px; }

  /* ---------- адаптив ---------- */
  @media (max-width: 1400px) { .s-ears, .s-eco { display: none; } }
  @media (max-width: 1000px) {
    .s-speaker, .s-hug { display: none; }
    .s-heart { width: 110px; left: 2%; }
    .s-snow { width: 90px; right: 4%; }
    .s-kid { width: 105px; left: 3%; }
    .s-xmas { width: 140px; right: 1%; }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .hero { padding: 200px 16px 250px; min-height: 0; }
    .s-heart { width: 84px; left: 6%; top: 18px; }
    .s-snow { width: 66px; right: 8%; top: 22px; }
    .s-kid { width: 78px; left: 8%; bottom: 16px; }
    .s-xmas { width: 132px; right: 5%; bottom: 10px; }
    .st figcaption { display: none; }
    .grid { grid-template-columns: 1fr; }
    .thumb { width: 72px; height: 72px; }
    .s-beanie { width: 130px; right: 2%; }
    footer p { max-width: 62%; }
  }
</style>
</head>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
    return n;
  };
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ----- режим именинника: открой сайт один раз со ссылкой ?me -----
  const params = new URLSearchParams(location.search);
  if (params.has('me')) { store.set('wl_owner', true); history.replaceState(null, '', location.pathname); }
  let owner = store.get('wl_owner', false);
  const applyOwner = () => document.body.classList.toggle('owner', owner);
  $('#exitOwner').onclick = () => { owner = false; store.set('wl_owner', false); applyOwner(); render(); };
  applyOwner();

  // ----- шапка -----
  const bday = new Date(CONFIG.BIRTHDAY);
  $('#title').textContent = CONFIG.TITLE;
  $('#lead').textContent = 'Здесь всё, что меня правда порадует. Нажми «Подарю это» — остальные увидят, что подарок занят, а кто его дарит, я узнаю только 3 января.';

  let toastT;
  const toast = t => { const n = $('#toast'); n.textContent = t; n.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => n.classList.remove('show'), 3200); };

  // ----- API (или демо) -----
  const demo = !CONFIG.API_URL;
  $('#demo').hidden = !demo;
  const demoDB = () => store.get('wl_demo', {
    gifts: [
      { id: 'a1', title: 'Беспроводные наушники', url: 'https://example.com', price: '40 000 ₸', image: '', note: 'Любой цвет, кроме белого', priority: true, received: false },
      { id: 'a2', title: 'Сертификат в книжный', url: '', price: '10 000 ₸', image: '', note: 'Номинал на твой вкус', priority: false, received: false },
      { id: 'a3', title: 'Френч-пресс на 1 литр', url: 'https://example.com', price: '12 000 ₸', image: '', note: '', priority: false, received: false },
      { id: 'a4', title: 'Настольная игра «Каркассон»', url: '', price: '18 000 ₸', image: '', note: 'Базовая версия, без дополнений', priority: true, received: false },
      { id: 'a5', title: 'Шерстяной шарф', url: '', price: '', image: '', note: '', priority: false, received: true }
    ],
    res: {}, wishes: []
  });
  const api = {
    async list() {
      if (demo) { const d = demoDB(); const open = new Date() >= bday;
        return { ok: true, gifts: d.gifts.map(g => ({ ...g, reserved: !!d.res[g.id] })), wishesOpen: open, wishesCount: d.wishes.length, wishes: open ? d.wishes : [] }; }
      const r = await fetch(CONFIG.API_URL); return r.json();
    },
    async post(body) {
      if (demo) {
        const d = demoDB(); let out = { ok: true };
        if (body.action === 'reserve') { if (d.res[body.id]) out = { ok: false, error: 'taken' }; else { out.code = Math.random().toString(36).slice(2, 7).toUpperCase(); d.res[body.id] = out.code; } }
        if (body.action === 'cancel') { if (d.res[body.id] && d.res[body.id] === body.code.toUpperCase()) delete d.res[body.id]; else out = { ok: false, error: 'wrong_code' }; }
        if (body.action === 'wish') d.wishes.push({ name: body.name, text: body.text });
        store.set('wl_demo', d); return out;
      }
      const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      return r.json();
    }
  };

  let data = null;
  const myCodes = () => store.get('wl_codes', {});
  const setMyCode = (id, code) => { const m = myCodes(); if (code) m[id] = code; else delete m[id]; store.set('wl_codes', m); };

  async function load() {
    try { data = await api.list(); if (!data.ok) throw new Error(data.error); render(); }
    catch (e) { $('#gifts').replaceChildren(el('div', { class: 'empty' }, 'Не получилось загрузить список. Проверь интернет и обнови страницу.')); }
  }

  const ERR = { taken: 'Этот подарок только что забронировал кто-то другой.', wrong_code: 'Код не подошёл. Проверь буквы и цифры.', received: 'Этот подарок уже получен.', empty: 'Заполни имя и текст.' };

  async function act(btn, body, onOk) {
    btn.disabled = true;
    try {
      const r = await api.post(body);
      if (r.ok) onOk(r); else toast(ERR[r.error] || 'Не получилось. Попробуй ещё раз.');
    } catch { toast('Нет связи с сервером. Попробуй ещё раз.'); }
    btn.disabled = false;
    await load();
  }

  function giftTag(g) {
    const mine = myCodes()[g.id];
    const reserved = g.reserved && !owner;
    const cls = ['tag', g.priority && 'has-want', g.image && 'has-img', reserved && (mine ? 'mine' : 'taken')].filter(Boolean).join(' ');
    const title = g.url ? el('a', { href: g.url, target: '_blank', rel: 'noopener' }, g.title) : g.title;
    const actions = el('div', { class: 'actions' });

    if (g.received || owner) { /* без действий */ }
    else if (!g.reserved) {
      const b = el('button', { class: 'btn', type: 'button' }, 'Подарю это');
      b.onclick = () => act(b, { action: 'reserve', id: g.id }, r => { setMyCode(g.id, r.code); toast(`Забронировано. Твой код отмены: ${r.code}`); });
      actions.append(b);
    } else if (mine) {
      const b = el('button', { class: 'btn ghost', type: 'button' }, 'Отменить бронь');
      b.onclick = () => act(b, { action: 'cancel', id: g.id, code: mine }, () => { setMyCode(g.id, null); toast('Бронь отменена.'); });
      actions.append(el('span', { class: 'status' }, 'Это даришь ты. Код отмены'), el('span', { class: 'code' }, mine), b);
    } else {
      const open = el('button', { class: 'link', type: 'button' }, 'Это я бронировал — отменить по коду');
      actions.append(el('span', { class: 'status' }, 'Уже кто-то дарит'), open);
      open.onclick = () => {
        const inp = el('input', { 'aria-label': 'Код отмены', placeholder: 'Код отмены', maxlength: 8, autocomplete: 'off' });
        const b = el('button', { class: 'btn ghost', type: 'submit' }, 'Отменить бронь');
        const f = el('form', { class: 'codeform' }, inp, b);
        f.onsubmit = e => { e.preventDefault(); act(b, { action: 'cancel', id: g.id, code: inp.value.trim() }, () => { setMyCode(g.id, null); toast('Бронь отменена.'); }); };
        open.replaceWith(f); inp.focus();
      };
    }

    return el('article', { class: cls },
      g.priority && el('span', { class: 'want' }, 'очень хочу'),
      el('h3', {}, title),
      g.price && el('div', { class: 'price' }, g.price),
      g.note && el('p', { class: 'note' }, g.note),
      g.image && el('img', { class: 'thumb', src: g.image, alt: '', loading: 'lazy', onerror: e => e.target.remove() }),
      actions.childNodes.length ? actions : null
    );
  }

  function render() {
    if (!data) return;
    const active = data.gifts.filter(g => !g.received);
    // сначала свободные, занятые — в конец; внутри каждой группы «очень хочу» выше
    active.sort((a, b) => (owner ? 0 : a.reserved - b.reserved) || (b.priority - a.priority));
    $('#gifts').replaceChildren(...(active.length ? active.map(giftTag)
      : [el('div', { class: 'empty' }, 'Список пока пустой: я ещё думаю. Загляни чуть позже.')]));

    const done = data.gifts.filter(g => g.received);
    $('#doneSection').hidden = !done.length;
    $('#done').replaceChildren(...done.map(giftTag));

    renderWall();
  }

  function renderWall() {
    const wall = $('#wall');
    const kids = [];
    if (data.wishesOpen) {
      if (data.wishes.length) kids.push(el('div', { class: 'cards' }, data.wishes.map(w => el('div', { class: 'card' }, el('p', {}, w.text), el('b', {}, w.name)))));
      else kids.push(el('div', { class: 'empty' }, 'Поздравлений пока нет. Напиши первым!'));
    } else {
      const days = Math.max(1, Math.ceil((bday - new Date()) / 864e5));
      const n = data.wishesCount;
      kids.push(el('div', { class: 'lock' },
        el('p', { class: 'big' }, 'Откроется 3 января'),
        el('p', {}, owner ? 'Тексты спрятаны до дня рождения — даже от тебя.' : 'Напиши поздравление заранее. Именинник прочитает его только в день рождения.'),
        el('p', { class: 'muted' }, `Уже написали: ${n}. До открытия ${days} ${plural(days, 'день', 'дня', 'дней')}.`)));
    }
    if (!owner) kids.push(wishForm());
    wall.replaceChildren(...kids);
  }

  function wishForm() {
    const name = el('input', { name: 'name', maxlength: 60, required: true, autocomplete: 'name' });
    const text = el('textarea', { name: 'text', maxlength: 1000, required: true });
    const b = el('button', { class: 'btn', type: 'submit' }, 'Отправить поздравление');
    const f = el('form', { class: 'wish' },
      el('label', {}, 'Твоё имя', name),
      el('label', {}, 'Поздравление', text),
      el('div', {}, b));
    f.onsubmit = e => { e.preventDefault(); act(b, { action: 'wish', name: name.value, text: text.value }, () => toast('Поздравление отправлено.')); };
    return f;
  }

  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }

  load();
})();
</script>
</body>
</html>
